<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Knowledge Cosmos - Vũ Trụ Tri Thức</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #030712; color: #f8fafc; overflow-x: hidden; }
    .nebula-bg {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: radial-gradient(circle at 15% 20%, rgba(16, 185, 129, 0.15) 0%, transparent 45%),
                  radial-gradient(circle at 85% 80%, rgba(168, 85, 247, 0.15) 0%, transparent 45%);
      z-index: -1; pointer-events: none;
    }
    .cosmic-card {
      background: rgba(15, 23, 42, 0.65); backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08); transition: all 0.4s ease;
    }
    .cosmic-card:hover { transform: translateY(-6px) scale(1.02); border-color: rgba(16, 185, 129, 0.6); box-shadow: 0 0 30px -5px rgba(16, 185, 129, 0.4); }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-6 md:p-12 relative">

  <div class="nebula-bg"></div>

  <!-- Header -->
  <header class="flex flex-wrap justify-between items-center gap-4 mb-10 z-10 max-w-7xl mx-auto w-full">
    <div class="flex items-center gap-3">
      <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-emerald-500 to-purple-600 p-0.5 flex items-center justify-center">
        <div class="w-full h-full bg-slate-950 rounded-[14px] flex items-center justify-center">
          <i class="fa-solid fa-globe text-emerald-400 text-xl"></i>
        </div>
      </div>
      <div>
        <h1 class="text-xl font-extrabold tracking-tight text-white">KNOWLEDGE COSMOS</h1>
        <p class="text-xs text-slate-400">Vũ trụ Tri thức & Sơ đồ Tư duy Tương tác Song ngữ</p>
      </div>
    </div>
  </header>

  <!-- Lessons Grid Cells -->
  <main class="max-w-7xl mx-auto w-full z-10 space-y-8 flex-1">
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">

      <!-- Cell 1: Sinh học 11 Bài 1 -->
      <a href="viewer.html?lesson=biology_11_lesson_1" class="cosmic-card p-6 rounded-3xl relative overflow-hidden group">
        <div class="flex justify-between items-start mb-4">
          <span class="px-3 py-1 rounded-full text-[10px] font-extrabold uppercase bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">
            Biology • Unit 1
          </span>
          <div class="w-10 h-10 rounded-2xl bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-emerald-400">
            <i class="fa-solid fa-dna text-lg"></i>
          </div>
        </div>
        <h3 class="text-lg font-bold text-white group-hover:text-emerald-300">Metabolism & Energy Transformation</h3>
        <p class="text-xs text-slate-400 mt-1 font-medium">Trao đổi chất & Chuyển hóa năng lượng ở sinh vật</p>
        <div class="mt-6 pt-4 border-t border-white/5 flex items-center justify-between text-[11px] text-emerald-400 font-semibold">
          <span><i class="fa-solid fa-circle-nodes mr-1"></i> Interactive Canvas</span>
          <span>Khám phá <i class="fa-solid fa-arrow-right ml-1"></i></span>
        </div>
      </a>

    </div>
  </main>

  <footer class="mt-12 text-center text-xs text-slate-500 z-10 border-t border-white/5 pt-6 max-w-7xl mx-auto w-full">
    © 2026 Knowledge Cosmos. Built with Gemini AI.
  </footer>

</body>
</html>
