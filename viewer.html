<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cosmic Mind Map Viewer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; user-select: none; overflow: hidden; background-color: #030712; color: #f8fafc; }
    #mindmap-canvas { cursor: grab; touch-action: none; }
    #mindmap-canvas:active { cursor: grabbing; }
    .glass-panel { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); }
  </style>
</head>
<body class="w-screen h-screen relative flex flex-col">

  <!-- Back to Dashboard Button & Header -->
  <header class="absolute top-4 left-4 right-4 z-20 flex flex-wrap justify-between items-center gap-3 pointer-events-none">
    <div class="flex items-center gap-3 pointer-events-auto">
      <a href="index.html" class="glass-panel p-3.5 rounded-2xl text-slate-300 hover:text-white hover:bg-white/10 transition-all flex items-center gap-2 text-xs font-bold shadow-2xl">
        <i class="fa-solid fa-arrow-left"></i> <span>Về Vũ Trụ</span>
      </a>
      <div class="glass-panel px-5 py-2.5 rounded-2xl flex items-center gap-3 shadow-2xl">
        <div id="header-icon" class="bg-gradient-to-tr from-emerald-500 to-teal-400 p-2 rounded-xl text-slate-950 font-black">
          <i class="fa-solid fa-atom text-lg"></i>
        </div>
        <div>
          <h1 id="header-title-en" class="text-sm font-bold text-white leading-tight">Loading Cosmos...</h1>
          <p id="header-title-vi" class="text-[11px] font-medium text-emerald-400">Đang tải sơ đồ tư duy...</p>
        </div>
      </div>
    </div>

    <!-- Search Controls -->
    <div class="flex items-center gap-2 pointer-events-auto">
      <div class="relative glass-panel rounded-xl overflow-hidden flex items-center">
        <i class="fa-solid fa-magnifying-glass text-slate-400 pl-4 text-xs"></i>
        <input id="search-input" type="text" placeholder="Tìm kiếm khái niệm..." class="bg-transparent text-xs text-slate-200 placeholder-slate-400 px-3 py-2focus:outline-none w-40 sm:w-56">
      </div>
      <button id="reset-view-btn" class="glass-panel p-2.5 rounded-xl text-slate-300 hover:text-white" title="Reset View"><i class="fa-solid fa-compress"></i></button>
    </div>
  </header>

  <canvas id="mindmap-canvas" class="w-full h-full block bg-slate-950"></canvas>

  <!-- Sidebar Detail Panel -->
  <aside id="detail-sidebar" class="absolute top-0 right-0 h-full w-full sm:w-96 z-30 glass-panel translate-x-full transition-transform duration-300 flex flex-col border-l border-white/10 shadow-2xl">
    <div class="p-5 border-b border-white/10 flex items-center justify-between bg-slate-900/50">
      <span id="sidebar-category-badge" class="px-2.5 py-1 rounded-lg text-xs font-bold uppercase tracking-wider bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">Concept</span>
      <button id="close-sidebar-btn" class="p-2 text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
    </div>
    <div class="p-6 overflow-y-auto flex-1 space-y-6">
      <div>
        <h2 id="sidebar-title-en" class="text-xl font-extrabold text-white">Select Node</h2>
        <p id="sidebar-title-vi" class="text-xs font-semibold text-emerald-400 mt-0.5">Chọn nhánh trên sơ đồ</p>
      </div>
      <div class="space-y-4 text-xs">
        <div>
          <h3 class="font-bold text-slate-400 uppercase tracking-wider mb-1.5"><i class="fa-solid fa-align-left text-emerald-400"></i> English Explanation</h3>
          <p id="sidebar-desc-en" class="text-slate-300 bg-slate-900/40 p-3.5 rounded-xl border border-white/5 leading-relaxed"></p>
        </div>
        <div>
          <h3 class="font-bold text-slate-400 uppercase tracking-wider mb-1.5"><i class="fa-solid fa-language text-cyan-400"></i> Giải thích Tiếng Việt</h3>
          <p id="sidebar-desc-vi" class="text-slate-300 bg-slate-900/40 p-3.5 rounded-xl border border-white/5 leading-relaxed"></p>
        </div>
        <div id="sidebar-keyterms-container">
          <h3 class="font-bold text-slate-400 uppercase tracking-wider mb-1.5"><i class="fa-solid fa-key text-amber-400"></i> Key Vocabulary</h3>
          <div id="sidebar-keyterms" class="flex flex-wrap gap-1.5"></div>
        </div>
        <div id="sidebar-equation-box" class="hidden">
          <h3 class="font-bold text-slate-400 uppercase tracking-wider mb-1.5"><i class="fa-solid fa-flask text-rose-400"></i> Equation / Summary</h3>
          <div id="sidebar-equation" class="font-mono bg-slate-900 p-3 rounded-xl border border-rose-500/20 text-rose-300 overflow-x-auto"></div>
        </div>
      </div>
    </div>
  </aside>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const lessonId = urlParams.get('lesson') || 'biology_11_lesson_1';

    let mindMapData = null;
    const canvas = document.getElementById('mindmap-canvas');
    const ctx = canvas.getContext('2d');
    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    let transform = { x: width / 2, y: height / 2, scale: 1 };
    let isDragging = false, dragStart = { x: 0, y: 0 };
    let hoverNode = null, activeNode = null, searchQuery = "";
    let collapsedNodes = new Set();

    // Fetch Dynamic JSON File
    fetch(`data/${lessonId}.json`)
      .then(res => res.json())
      .then(data => {
        mindMapData = data;
        document.getElementById('header-title-en').innerText = mindMapData.labelEn;
        document.getElementById('header-title-vi').innerText = mindMapData.labelVi;
        layoutMindMap();
        openDetailSidebar(mindMapData);
        render();
      })
      .catch(err => {
        document.getElementById('header-title-en').innerText = "Lesson Not Found";
        document.getElementById('header-title-vi').innerText = "Không tìm thấy dữ liệu bài học này!";
      });

    function layoutMindMap() {
      if (!mindMapData) return;
      function processAngles(node, depth, startAngle, endAngle) {
        node.depth = depth; node.x = 0; node.y = 0;
        if (!node.children || node.children.length === 0 || collapsedNodes.has(node.id)) return;
        const angleStep = (endAngle - startAngle) / node.children.length;
        node.children.forEach((child, i) => {
          const midAngle = startAngle + i * angleStep + angleStep / 2;
          child.angle = midAngle;
          processAngles(child, depth + 1, startAngle + i * angleStep, startAngle + (i + 1) * angleStep);
        });
      }
      mindMapData.angle = 0;
      processAngles(mindMapData, 0, 0, Math.PI * 2);

      function computeCoordinates(node) {
        if (node.id === "root") { node.x = 0; node.y = 0; }
        else {
          const dist = node.depth * 180 + (node.depth > 1 ? 40 : 0);
          node.x = Math.cos(node.angle) * dist;
          node.y = Math.sin(node.angle) * dist;
        }
        if (node.children && !collapsedNodes.has(node.id)) node.children.forEach(computeCoordinates);
      }
      computeCoordinates(mindMapData);
    }

    function render() {
      ctx.save();
      ctx.clearRect(0, 0, width, height);
      ctx.translate(transform.x, transform.y);
      ctx.scale(transform.scale, transform.scale);
      if (mindMapData) {
        drawConnections(mindMapData);
        drawNodes(mindMapData);
      }
      ctx.restore();
      requestAnimationFrame(render);
    }

    function drawConnections(node) {
      if (!node.children || collapsedNodes.has(node.id)) return;
      node.children.forEach(child => {
        ctx.beginPath();
        ctx.moveTo(node.x, node.y);
        ctx.quadraticCurveTo((node.x + child.x)/2, (node.y + child.y)/2, child.x, child.y);
        ctx.strokeStyle = child.color + "80";
        ctx.lineWidth = Math.max(1.5, 4 - child.depth);
        ctx.stroke();
        drawConnections(child);
      });
    }

    function drawNodes(node) {
      const isHovered = hoverNode === node, isActive = activeNode === node;
      if (isHovered || isActive) {
        ctx.beginPath();
        ctx.arc(node.x, node.y, node.radius + 8, 0, Math.PI * 2);
        ctx.fillStyle = node.color + "40"; ctx.fill();
      }
      ctx.beginPath();
      ctx.arc(node.x, node.y, node.radius, 0, Math.PI * 2);
      ctx.fillStyle = node.color; ctx.fill();
      ctx.strokeStyle = isActive ? "#ffffff" : "rgba(255, 255, 255, 0.4)";
      ctx.lineWidth = 2; ctx.stroke();

      ctx.fillStyle = "#ffffff"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.font = `bold ${node.depth === 0 ? 13 : 11}px 'Plus Jakarta Sans'`;
      let displayLabel = node.labelEn.length > 20 ? node.labelEn.substring(0, 18) + ".." : node.labelEn;
      ctx.fillText(displayLabel, node.x, node.y);

      if (node.children && !collapsedNodes.has(node.id)) node.children.forEach(drawNodes);
    }

    function findNodeAt(px, py, node = mindMapData) {
      if (!node) return null;
      const worldX = (px - transform.x) / transform.scale;
      const worldY = (py - transform.y) / transform.scale;
      if (Math.hypot(worldX - node.x, worldY - node.y) <= node.radius) return node;
      if (node.children && !collapsedNodes.has(node.id)) {
        for (const child of node.children) {
          const found = findNodeAt(px, py, child);
          if (found) return found;
        }
      }
      return null;
    }

    canvas.addEventListener('mousedown', e => {
      const node = findNodeAt(e.clientX, e.clientY);
      if (node) { activeNode = node; openDetailSidebar(node); }
      else { isDragging = true; dragStart = { x: e.clientX - transform.x, y: e.clientY - transform.y }; }
    });
    window.addEventListener('mousemove', e => {
      if (isDragging) { transform.x = e.clientX - dragStart.x; transform.y = e.clientY - dragStart.y; }
      else { hoverNode = findNodeAt(e.clientX, e.clientY); canvas.style.cursor = hoverNode ? 'pointer' : 'grab'; }
    });
    window.addEventListener('mouseup', () => isDragging = false);
    canvas.addEventListener('wheel', e => {
      e.preventDefault();
      const zoom = e.deltaY < 0 ? 1.1 : 0.9;
      transform.scale = Math.min(Math.max(transform.scale * zoom, 0.3), 3.0);
    }, { passive: false });

    function openDetailSidebar(node) {
      document.getElementById('sidebar-title-en').innerText = node.labelEn;
      document.getElementById('sidebar-title-vi').innerText = node.labelVi;
      document.getElementById('sidebar-desc-en').innerText = node.descEn;
      document.getElementById('sidebar-desc-vi').innerText = node.descVi;
      const keyTermsContainer = document.getElementById('sidebar-keyterms');
      keyTermsContainer.innerHTML = '';
      if (node.keyTerms) {
        node.keyTerms.forEach(term => {
          const badge = document.createElement('span');
          badge.className = "px-2 py-0.5 rounded-lg text-[10px] bg-slate-800 text-slate-300 border border-slate-700";
          badge.innerText = term;
          keyTermsContainer.appendChild(badge);
        });
      }
      document.getElementById('detail-sidebar').classList.remove('translate-x-full');
    }
    document.getElementById('close-sidebar-btn').onclick = () => document.getElementById('detail-sidebar').classList.add('translate-x-full');
    document.getElementById('reset-view-btn').onclick = () => transform = { x: width / 2, y: height / 2, scale: 1 };
  </script>
</body>
</html>
