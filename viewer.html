<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Knowledge Cosmos - Mindmap Viewer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #030712; color: #f8fafc; overflow: hidden; }
    .nebula-bg {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: radial-gradient(circle at 50% 50%, rgba(15, 23, 42, 0.8) 0%, rgba(3, 7, 18, 1) 100%);
      z-index: -1; pointer-events: none;
    }
    .node-circle { cursor: pointer; transition: all 0.3s ease; }
    .node-circle:hover { filter: drop-shadow(0 0 12px currentColor); }
    .link-line { stroke-opacity: 0.4; stroke-dasharray: 4; animation: dash 20s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -100; } }
  </style>
</head>
<body class="w-screen h-screen relative flex">

  <div class="nebula-bg"></div>

  <!-- Top Bar Controls -->
  <div class="absolute top-6 left-6 z-20 flex items-center gap-3">
    <a href="index.html" class="px-4 py-2.5 rounded-xl bg-slate-900/80 border border-white/10 text-xs font-bold text-slate-300 hover:text-white hover:border-cyan-500/50 transition-all flex items-center gap-2 backdrop-blur-md">
      <i class="fa-solid fa-arrow-left"></i> Back to Hub
    </a>
  </div>

  <!-- Main SVG Canvas -->
  <main class="w-full h-full">
    <svg id="cosmos-svg" class="w-full h-full cursor-grab active:cursor-grabbing"></svg>
  </main>

  <!-- Sidebar Detail Panel -->
  <aside id="detail-panel" class="absolute top-6 right-6 bottom-6 w-96 bg-slate-900/90 border border-white/10 rounded-3xl p-6 backdrop-blur-xl z-20 transform translate-x-[110%] transition-transform duration-300 overflow-y-auto flex flex-col justify-between shadow-2xl">
    <div>
      <div class="flex justify-between items-center mb-4">
        <span id="node-category" class="px-3 py-1 rounded-full text-[10px] font-extrabold uppercase bg-cyan-500/20 text-cyan-400 border border-cyan-500/30">
          Category
        </span>
        <button onclick="closePanel()" class="text-slate-400 hover:text-white p-1">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <h2 id="node-title-vi" class="text-xl font-extrabold text-white mb-1">Tên bài học</h2>
      <h3 id="node-title-en" class="text-xs font-semibold text-cyan-400/80 mb-4">English Title</h3>

      <!-- Vector Image Container -->
      <div id="node-image-container"></div>

      <!-- Description -->
      <div class="space-y-3 mt-4">
        <div class="p-4 rounded-2xl bg-slate-950/50 border border-white/5">
          <p class="text-xs text-slate-300 leading-relaxed" id="node-desc-vi"></p>
          <p class="text-[11px] text-slate-500 mt-2 italic leading-relaxed" id="node-desc-en"></p>
        </div>

        <!-- Equation Box -->
        <div id="node-equation-box" class="hidden p-4 rounded-2xl bg-amber-500/10 border border-amber-500/20 text-amber-300 font-mono text-xs text-center font-bold">
        </div>

        <!-- Key Terms -->
        <div>
          <h4 class="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-2">Key Terms</h4>
          <div id="node-terms" class="flex flex-wrap gap-1.5"></div>
        </div>
      </div>
    </div>

    <div class="pt-4 border-t border-white/5 text-[10px] text-slate-500 text-center">
      Click anywhere on canvas to close details
    </div>
  </aside>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const lessonId = urlParams.get('lesson') || 'physics_unit_1';

    const svg = d3.select("#cosmos-svg");
    const width = window.innerWidth;
    const height = window.innerHeight;

    const g = svg.append("g");

    // Zoom setup
    svg.call(d3.zoom().scaleExtent([0.3, 3]).on("zoom", (e) => g.attr("transform", e.transform)));

    // Load JSON Data
    fetch(`data/${lessonId}.json`)
      .then(res => {
        if (!res.ok) throw new Error("Lesson Not Found");
        return res.json();
      })
      .then(data => renderMindmap(data))
      .catch(err => {
        alert("Error loading lesson: " + err.message);
      });

    function renderMindmap(rootData) {
      const root = d3.hierarchy(rootData);
      const treeLayout = d3.tree().size([height - 200, width - 400]);
      treeLayout(root);

      // Links
      g.selectAll(".link-line")
        .data(root.links())
        .enter()
        .append("line")
        .attr("class", "link-line")
        .attr("x1", d => d.source.y + 150)
        .attr("y1", d => d.source.x + 100)
        .attr("x2", d => d.target.y + 150)
        .attr("y2", d => d.target.x + 100)
        .attr("stroke", d => d.target.data.color || "#38bdf8");

      // Nodes
      const nodes = g.selectAll(".node-group")
        .data(root.descendants())
        .enter()
        .append("g")
        .attr("class", "node-group")
        .attr("transform", d => `translate(${d.y + 150},${d.x + 100})`)
        .on("click", (e, d) => showDetail(d.data));

      nodes.append("circle")
        .attr("r", d => d.data.radius || 25)
        .attr("fill", d => d.data.color || "#0284c7")
        .attr("class", "node-circle")
        .attr("style", d => `color: ${d.data.color || '#0284c7'}`);

      nodes.append("text")
        .text(d => d.data.labelVi)
        .attr("x", d => d.children ? - (d.data.radius + 10) : (d.data.radius + 10))
        .attr("y", 4)
        .attr("text-anchor", d => d.children ? "end" : "start")
        .attr("fill", "#f8fafc")
        .attr("font-size", "12px")
        .attr("font-weight", "600");
    }

    function showDetail(data) {
      document.getElementById("node-category").innerText = data.category || "General";
      document.getElementById("node-title-vi").innerText = data.labelVi;
      document.getElementById("node-title-en").innerText = data.labelEn;
      document.getElementById("node-desc-vi").innerText = data.descVi || "";
      document.getElementById("node-desc-en").innerText = data.descEn || "";

      // Render Vector Image
      const imgContainer = document.getElementById("node-image-container");
      if (data.imageUrl) {
        imgContainer.innerHTML = `
          <div class="my-3 p-4 bg-slate-950 border border-amber-500/20 rounded-2xl flex flex-col items-center justify-center">
            <img src="${data.imageUrl}" alt="${data.labelVi}" class="max-h-44 w-auto object-contain drop-shadow-[0_0_15px_rgba(245,158,11,0.3)] transition-transform hover:scale-105" />
            <span class="text-[9px] text-amber-400/60 mt-2 font-mono uppercase tracking-wider">Vector Illustration</span>
          </div>
        `;
      } else {
        imgContainer.innerHTML = "";
      }

      // Render Equation
      const eqBox = document.getElementById("node-equation-box");
      if (data.equation) {
        eqBox.classList.remove("hidden");
        eqBox.innerText = data.equation;
      } else {
        eqBox.classList.add("hidden");
      }

      // Render Terms
      const termsContainer = document.getElementById("node-terms");
      termsContainer.innerHTML = "";
      if (data.keyTerms) {
        data.keyTerms.forEach(term => {
          const badge = document.createElement("span");
          badge.className = "px-2.5 py-1 rounded-lg bg-slate-800 text-[10px] text-slate-300 border border-white/5 font-medium";
          badge.innerText = term;
          termsContainer.appendChild(badge);
        });
      }

      document.getElementById("detail-panel").classList.remove("translate-x-[110%]");
    }

    function closePanel() {
      document.getElementById("detail-panel").classList.add("translate-x-[110%]");
    }
  </script>
</body>
</html>
